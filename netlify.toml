[build]
  command = "npm run build"
  publish = "dist"

# SPA 가 아니라 단일 페이지지만, 존재하지 않는 경로도 앱으로 넘겨준다
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 상권 데이터는 분기 단위로만 바뀌므로 길게 캐시한다
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
